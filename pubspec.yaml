name: autodiary
description: "АвтоДневник - учет расходов на автомобиль"
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.13.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  http: ^1.2.1
  app_installer_plus: ^1.2.0
  
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2

  # Состояние и роутинг
  provider: ^6.1.2
  go_router: ^14.6.0

  # UI и утилиты
  fl_chart: ^0.69.0
  intl: ^0.20.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1E88E5"
    theme_color: "#1E88E5"
